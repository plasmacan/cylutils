[build-system]
requires = ["setuptools>=82", "setuptools-scm"]
build-backend = "setuptools.build_meta"


[project]
name = "cylutils"
dynamic = ["version"]
description = "A collection of utilities for plasmacan/cylinder applications."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["cylinder", "waitress", "click", "questionary", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pre-commit"]

[project.scripts]
cylutils = "cylutils.cli:cli"

[[project.authors]]
name = "Nicholas Gray"
email = "nicholas@tier2.tech"

[project.urls]
Homepage = "https://github.com/plasmacan/cylutils"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.setuptools.package-data]
cylutils = ["resources/**"]


[tool.ruff]
target-version = "py313"
line-length = 107 # 107 is the Github diff-view line-wrap limit on a 1080 monitor at 1x zoom
exclude = [
    "tests/*",
    ".ci-tools/*",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "A",                # redefined builtins
    "C90",              # mccabe / too-complex
    "PLE", "PLW", "PLR",# pylint error / warning / refactor
    "COM818",           # trailing-comma-tuple equivalent
    "B006", "B015", "B018",  # dangerous-default-value / pointless-statement-ish
]
ignore = [
    "E203",    # keep formatter-compatible whitespace behavior
    "E402",    # flake8 ignored this
    "E501",    # line too long handled by formatter
    "F401",    # flake8 ignored unused imports

    "PLR0911", # too-many-return-statements
    "PLR0913", # too-many-arguments
    "PLR1714", # consider-using-in
    "PLR1716", # chained-comparison
    "PLW1510", # subprocess-run-check
]
dummy-variable-rgx = "_$|dummy"
task-tags = ["FIXME", "XXX", "TODO"]

[tool.ruff.lint.mccabe]
max-complexity = 15


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cylutils --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["cylutils"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
skip_covered = true
ignore_errors = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = ".repo-reports/coverage"
skip_covered = false

[tool.ruff.lint.isort]
known-first-party = ["cylutils"]
